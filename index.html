<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TucuMatch - Citas y Encuentros en Tucumán</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @keyframes pulseHeart {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.15); }
        }
        .heart-pulse { animation: pulseHeart 1.5s infinite; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-between font-sans">

    <!-- Header Principal -->
    <header class="w-full max-w-md bg-slate-900/90 backdrop-blur-md border-b border-slate-800 p-4 sticky top-0 z-40 flex items-center justify-between shadow-lg">
        <div class="flex items-center space-x-2">
            <i class="fa-solid fa-heart-circle-bolt text-rose-500 text-2xl heart-pulse"></i>
            <h1 class="text-xl font-black tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-rose-500 via-rose-400 to-amber-400">TucuMatch</h1>
        </div>
        <div class="flex items-center space-x-2">
            <button onclick="abrirModalCrearPerfil()" class="px-3 py-1.5 rounded-full bg-rose-600 hover:bg-rose-500 text-xs font-semibold text-white transition flex items-center">
                <i class="fa-solid fa-plus mr-1"></i> Crear Perfil
            </button>
            <button onclick="abrirSelfieModal()" class="px-3 py-1.5 rounded-full bg-emerald-500/20 text-xs font-semibold text-emerald-400 border border-emerald-500/30 hover:bg-emerald-500/30">
                <i class="fa-solid fa-shield-halved mr-1"></i>Verificar
            </button>
        </div>
    </header>

    <!-- Contenido Principal / Tarjeta de Perfil -->
    <main class="w-full max-w-md p-4 flex-1 flex flex-col justify-center items-center">
        <div id="card-container" class="w-full bg-slate-900 border border-slate-800 rounded-3xl overflow-hidden shadow-2xl relative flex flex-col">
            <!-- Galería de Fotos -->
            <div class="relative h-96 w-full bg-slate-800">
                <img id="profile-img" src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=500" class="w-full h-full object-cover" alt="Perfil">
                
                <div class="absolute top-3 left-3 bg-slate-900/80 backdrop-blur-md px-3 py-1 rounded-full text-xs font-semibold text-amber-400 border border-amber-500/30 flex items-center">
                    <i class="fa-solid fa-location-dot mr-1 text-rose-400"></i>
                    <span id="profile-barrio">Yerba Buena</span>
                </div>

                <div id="badge-verificado" class="absolute top-3 right-3 bg-emerald-500/90 text-white px-2.5 py-1 rounded-full text-xs font-bold shadow flex items-center">
                    <i class="fa-solid fa-check-double mr-1"></i> Verificado
                </div>
            </div>

            <!-- Detalles del Perfil -->
            <div class="p-5 flex-1 flex flex-col justify-between">
                <div>
                    <div class="flex items-baseline justify-between mb-2">
                        <h2 class="text-2xl font-bold text-white"><span id="profile-nombre">Lucía</span>, <span id="profile-edad" class="text-slate-400 font-normal">24</span></h2>
                    </div>
                    <p id="profile-bio" class="text-slate-300 text-sm leading-relaxed mb-4">Amante del cerro San Javier y el sanguchazo de milanesa con todo 🥪</p>
                    
                    <!-- Rompehielos Tucumano -->
                    <div class="bg-slate-800/60 rounded-xl p-3 border border-slate-700/50 mb-4">
                        <p class="text-xs text-rose-400 font-bold uppercase tracking-wider mb-1"> Pregunta Tucumana:</p>
                        <p class="text-xs text-slate-200 font-medium">¿Sanguche de milanesa en primera cita es buen plan o red flag?</p>
                    </div>
                </div>

                <!-- Botones de Acción -->
                <div class="flex items-center justify-evenly pt-2">
                    <button onclick="siguientePerfil()" class="w-14 h-14 rounded-full bg-slate-800 border border-slate-700 text-slate-400 hover:text-rose-400 hover:border-rose-500/50 text-xl flex items-center justify-center transition shadow-lg active:scale-95">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                    <button onclick="darLike()" class="w-16 h-16 rounded-full bg-gradient-to-r from-rose-500 to-pink-500 text-white text-2xl flex items-center justify-center transition shadow-xl shadow-rose-500/20 active:scale-95 hover:brightness-110">
                        <i class="fa-solid fa-heart-arrow-between-neighbors"></i>
                    </button>
                </div>
            </div>
        </div>
    </main>

    <!-- Modal: Crear Perfil con Galería -->
    <div id="modal-crear" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 w-full max-w-md rounded-2xl p-6 relative max-h-[90vh] overflow-y-auto">
            <button onclick="cerrarModalCrearPerfil()" class="absolute top-4 right-4 text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
            <h3 class="text-lg font-bold text-white mb-4">Crear Perfil en TucuMatch</h3>
            
            <form onsubmit="guardarNuevoPerfil(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Nombre</label>
                    <input type="text" id="nuevo-nombre" required class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-rose-500">
                </div>
                
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Edad</label>
                    <input type="number" id="nueva-edad" min="18" max="99" required class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-rose-500">
                </div>

                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Zona / Localidad de Tucumán</label>
                    <select id="nuevo-barrio" required class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-rose-500">
                        <option value="">Selecciona tu zona...</option>
                        <!-- Capital y Zonas Urbanas -->
                        <option value="San Miguel de Tucumán - Centro">San Miguel de Tucumán (Centro)</option>
                        <option value="San Miguel de Tucumán - Barrio Norte">San Miguel de Tucumán (Barrio Norte)</option>
                        <option value="San Miguel de Tucumán - Barrio Sur">San Miguel de Tucumán (Barrio Sur)</option>
                        <option value="Yerba Buena">Yerba Buena</option>
                        <option value="Tafí Viejo">Tafí Viejo</option>
                        <option value="Banda del Río Salí">Banda del Río Salí</option>
                        <option value="Alderetes">Alderetes</option>
                        <option value="Las Talitas">Las Talitas</option>
                        <!-- Oeste y Valles -->
                        <option value="Tafí del Valle">Tafí del Valle</option>
                        <option value="El Mollar">El Mollar</option>
                        <option value="San Javier">San Javier / Villa Nougués</option>
                        <option value="Lules">Lules</option>
                        <option value="Famaillá">Famaillá</option>
                        <option value="Monteros">Monteros</option>
                        <option value="Concepción">Concepción</option>
                        <option value="Aguilares">Aguilares</option>
                        <option value="Jalbardín / Alberdi">Juan Bautista Alberdi</option>
                        <!-- Este y Sur -->
                        <option value="Bella Vista">Bella Vista</option>
                        <option value="Simoca">Simoca</option>
                        <option value="Trancas">Trancas</option>
                        <option value="Burruyacú">Burruyacú</option>
                        <option value="La Cocha">La Cocha</option>
                        <option value="Graneros">Graneros</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Foto de Perfil (Subir desde la Galería)</label>
                    <input type="file" id="nueva-foto" accept="image/*" required onchange="previsualizarImagen(event)" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2 text-xs text-slate-300 file:mr-3 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-xs file:font-semibold file:bg-rose-600 file:text-white hover:file:bg-rose-500 cursor-pointer">
                    <div id="preview-container" class="mt-2 hidden">
                        <img id="img-preview" class="w-full h-40 object-cover rounded-lg border border-slate-700">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Bio / Presentación</label>
                    <textarea id="nueva-bio" rows="3" placeholder="Contá un poco sobre vos..." class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-rose-500"></textarea>
                </div>

                <button type="submit" class="w-full bg-rose-600 hover:bg-rose-500 text-white font-bold py-3 rounded-xl transition">Guardar Perfil</button>
            </form>
        </div>
    </div>

    <script>
        let perfiles = [];
        let indexActual = 0;
        let fotoCargadaBase64 = "";

        async function cargarPerfiles() {
            try {
                const res = await fetch('/api/profiles');
                perfiles = await res.json();
                mostrarPerfil(0);
            } catch (e) {
                console.log("Error cargando perfiles", e);
            }
        }

        function mostrarPerfil(idx) {
            if (!perfiles || perfiles.length === 0 || idx >= perfiles.length) {
                indexActual = 0;
            }
            const p = perfiles[indexActual];
            document.getElementById('profile-nombre').innerText = p.nombre;
            document.getElementById('profile-edad').innerText = p.edad;
            document.getElementById('profile-barrio').innerText = p.barrio;
            document.getElementById('profile-bio').innerText = p.bio || "¡Sin bio disponible!";
            document.getElementById('profile-img').src = p.fotos[0];
            
            const badge = document.getElementById('badge-verificado');
            if (p.verificado) badge.classList.remove('hidden');
            else badge.classList.add('hidden');
        }

        function siguientePerfil() {
            indexActual = (indexActual + 1) % perfiles.length;
            mostrarPerfil(indexActual);
        }

        function previsualizarImagen(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    fotoCargadaBase64 = e.target.result;
                    document.getElementById('img-preview').src = fotoCargadaBase64;
                    document.getElementById('preview-container').classList.remove('hidden');
                }
                reader.readAsDataURL(file);
            }
        }

        function abrirModalCrearPerfil() { document.getElementById('modal-crear').classList.remove('hidden'); }
        function cerrarModalCrearPerfil() { document.getElementById('modal-crear').classList.add('hidden'); }

        function guardarNuevoPerfil(e) {
            e.preventDefault();
            const nuevo = {
                id: Date.now(),
                nombre: document.getElementById('nuevo-nombre').value,
                edad: document.getElementById('nueva-edad').value,
                barrio: document.getElementById('nuevo-barrio').value,
                bio: document.getElementById('nueva-bio').value,
                verificado: true,
                fotos: [fotoCargadaBase64 || "https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=500"]
            };
            
            perfiles.unshift(nuevo);
            indexActual = 0;
            mostrarPerfil(0);
            cerrarModalCrearPerfil();
            alert("¡Perfil creado con éxito!");
        }

        window.onload = cargarPerfiles;
    </script>
</body>
</html>
